name: raga-io
options:
  bundleIdPrefix: com.ragaio
packages:
  Starscream:
    url: https://github.com/daltoniam/Starscream.git
    from: 4.0.0
targets:
  raga-io:
    type: application
    platform: iOS
    deploymentTarget: "12.0"
    sources: [ragaio]
    dependencies:
      - package: Starscream
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.ragaio.game
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
      INFOPLIST_FILE: ragaio/Info.plist
      GENERATE_INFOPLIST_FILE: NO
      CODE_SIGNING_ALLOWED: NO
      CODE_SIGNING_REQUIRED: NO
      CODE_SIGN_IDENTITY: ""
      ENABLE_BITCODE: NO
