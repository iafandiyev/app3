name: raga-io
options:
  bundleIdPrefix: com.ragaio
targets:
  raga-io:
    type: application
    platform: iOS
    deploymentTarget: "15.0"
    sources: [ragaio]
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.ragaio.game
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
      INFOPLIST_FILE: ragaio/Info.plist
      GENERATE_INFOPLIST_FILE: NO
      CODE_SIGNING_ALLOWED: NO
      CODE_SIGNING_REQUIRED: NO
      CODE_SIGN_IDENTITY: ""
      ENABLE_BITCODE: NO
